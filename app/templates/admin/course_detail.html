{% extends "base.html" %}

{% block content %}
<div class="container mx-auto p-6">
    <h1 class="text-2xl font-bold mb-6">{{ course.title }}</h1>
    
    <div class="flex flex-col md:flex-row gap-6">
        <!-- Content Viewer (Left) -->
        <div class="w-full md:w-2/3 bg-white rounded-lg shadow p-4">
            <div id="section-content" class="min-h-[400px]">
                <p class="text-gray-500">Select a section to view content</p>
            </div>
        </div>
        
        <!-- Section List (Right) -->
        <div class="w-full md:w-1/3 bg-white rounded-lg shadow p-4">
            <h2 class="text-lg font-semibold mb-4">Course Sections</h2>
            <div class="space-y-2">
                {% for section in course.sections|sort(attribute='order') %}
                <div class="border rounded-lg">
                    <button class="w-full text-left p-3 flex justify-between items-center hover:bg-gray-100"
                            hx-get="{{ url_for('student.get_section_content', section_id=section.id) }}"
                            hx-target="#section-content"
                            hx-swap="innerHTML"
                            hx-indicator=".htmx-indicator">
                        <div class="flex items-center">
                            <span class="mr-2">{{ loop.index }}.</span>
                            <span>{{ section.title }}</span>
                        </div>
                        {% if section.duration > 0 %}
                        <span class="text-sm text-gray-500">{{ section.duration }} min</span>
                        {% endif %}
                    </button>
                </div>
                {% endfor %}
            </div>
            <div class="mt-4">
                <a href="{{ url_for('admin.manage_courses') }}" 
                   class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 text-center block">
                    Back to Courses
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/htmx.org@1.9.6"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
    let player;
    function onYouTubeIframeAPIReady() {
        document.querySelectorAll('[id^="youtube-player-"]').forEach(iframe => {
            player = new YT.Player(iframe.id, {});
        });
    }
</script>
{% endblock %}
