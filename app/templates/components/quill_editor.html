<!-- Reusable Quill Rich Text Editor Component -->
<!-- Usage: pass field_id, field_name, initial_value, height, placeholder as template variables -->

{% if not quill_loaded %}
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<style>
.quill-editor-container { margin-bottom: 1rem; }
.ql-editor { font-size: 15px; line-height: 1.6; }
.ql-toolbar.ql-snow {
    border-radius: 8px 8px 0 0;
    background: #f9fafb;
    border-color: #d1d5db;
}
.ql-container.ql-snow {
    border-left: 1px solid #d1d5db;
    border-right: 1px solid #d1d5db;
    border-bottom: none;
    border-radius: 0;
}
.ql-editor.ql-blank::before { color: #9ca3af; font-style: italic; }

/* Table Zone — sits below Quill, same visual container */
.pace-table-zone {
    border: 1px solid #d1d5db;
    border-top: 1px dashed #e5e7eb;
    border-radius: 0 0 8px 8px;
    background: #fff;
    padding: 0 15px 12px;
    min-height: 0;
    font-size: 15px;
    font-family: inherit;
}
.pace-table-zone:empty {
    border-top: none;
    border-bottom: none;
    border-left: 1px solid #d1d5db;
    border-right: 1px solid #d1d5db;
    border-radius: 0 0 8px 8px;
    padding: 0;
}
.pace-table-zone .pace-table-wrap {
    position: relative;
    margin: 14px 0;
}
.pace-table-zone .pace-table-delete {
    position: absolute;
    top: -10px;
    right: -6px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid #fca5a5;
    background: #fff;
    color: #ef4444;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    z-index: 10;
}
.pace-table-zone .pace-table-delete:hover { background: #fef2f2; }
.pace-table-zone table {
    width: 100%;
    border-collapse: collapse;
    border: 1px solid #cbd5e1;
    font-size: 14px;
    font-family: inherit;
    table-layout: auto;
}
.pace-table-zone th {
    background: #f1f5f9 !important;
    border: 1px solid #cbd5e1;
    padding: 10px 14px;
    text-align: left;
    font-weight: 600;
    color: #1e293b;
}
.pace-table-zone td {
    border: 1px solid #cbd5e1;
    padding: 10px 14px;
    min-width: 90px;
    vertical-align: top;
    background: #fff;
}
.pace-table-zone tr:nth-child(even) td { background: #f8fafc; }
.pace-table-zone td:focus, .pace-table-zone th:focus {
    outline: 2px solid #93c5fd;
    outline-offset: -2px;
    background: #eff6ff !important;
}

/* Table styles in student/preview views */
.ql-editor table, .prose table {
    width: 100%; border-collapse: collapse;
    border: 1px solid #cbd5e1; font-size: 14px; margin: 1rem 0;
}
.ql-editor th, .prose th {
    background: #f1f5f9 !important; border: 1px solid #cbd5e1;
    padding: 10px 14px; font-weight: 600; color: #1e293b; text-align: left;
}
.ql-editor td, .prose td {
    border: 1px solid #cbd5e1; padding: 10px 14px; min-width: 80px; vertical-align: top;
}
.ql-editor tr:nth-child(even) td, .prose tr:nth-child(even) td { background: #f8fafc; }

/* Table button */
.ql-table-btn {
    display: inline-flex !important;
    align-items: center;
    gap: 4px;
    padding: 2px 8px !important;
    font-size: 12px !important;
    font-weight: 600 !important;
    color: #374151 !important;
    border: 1px solid #d1d5db !important;
    border-radius: 6px !important;
    background: #fff !important;
    cursor: pointer;
    transition: all 0.15s ease;
    vertical-align: middle;
}
.ql-table-btn:hover { background: #f3f4f6 !important; border-color: #9ca3af !important; }
</style>
{% set quill_loaded = true %}
{% endif %}

<!-- Editor + Table Zone Container -->
<div class="quill-editor-container">
    <div id="quill-{{ field_id }}" style="height: {{ height|default('300px') }};"></div>
    <div id="table-zone-{{ field_id }}" class="pace-table-zone" data-textarea="{{ field_id }}"></div>
    <textarea id="{{ field_id }}" name="{{ field_name }}" class="hidden"></textarea>
</div>

{% if not quill_script_loaded %}
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<!-- ══════════ Table Insert Modal ══════════ -->
<div id="quill-table-modal"
     style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.52);
            z-index:9999; align-items:center; justify-content:center; padding:16px;">
    <div style="background:#fff; border-radius:16px; max-width:380px; width:100%;
                padding:24px; box-shadow:0 24px 64px rgba(0,0,0,0.18); font-family:inherit;">
        <div style="display:flex; justify-content:space-between; align-items:center;
                    border-bottom:1px solid #e5e7eb; padding-bottom:14px; margin-bottom:18px;">
            <h3 style="margin:0; font-size:17px; font-weight:700; color:#111827;">📊 Insert Table</h3>
            <button type="button" onclick="closeQuillTableModal()"
                    style="background:none;border:none;font-size:22px;cursor:pointer;color:#9ca3af;line-height:1;padding:2px 6px;">✕</button>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px;">
            <div>
                <label style="display:block;font-size:11px;font-weight:700;color:#6b7280;
                              margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;">Rows</label>
                <input type="number" id="quill-table-rows" value="3" min="1" max="20"
                       style="width:100%;padding:10px 12px;border:1.5px solid #d1d5db;
                              border-radius:8px;font-size:15px;font-weight:600;outline:none;box-sizing:border-box;">
            </div>
            <div>
                <label style="display:block;font-size:11px;font-weight:700;color:#6b7280;
                              margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;">Columns</label>
                <input type="number" id="quill-table-cols" value="3" min="1" max="10"
                       style="width:100%;padding:10px 12px;border:1.5px solid #d1d5db;
                              border-radius:8px;font-size:15px;font-weight:600;outline:none;box-sizing:border-box;">
            </div>
        </div>
        <label style="display:flex;align-items:center;gap:10px;margin-bottom:22px;
                      cursor:pointer;font-size:13px;font-weight:500;color:#374151;">
            <input type="checkbox" id="quill-table-header" checked
                   style="width:16px;height:16px;cursor:pointer;accent-color:#2563eb;">
            Include Header Row
        </label>
        <div style="display:flex;justify-content:flex-end;gap:10px;border-top:1px solid #e5e7eb;padding-top:16px;">
            <button type="button" onclick="closeQuillTableModal()"
                    style="padding:9px 18px;border:1.5px solid #d1d5db;border-radius:8px;
                           background:#fff;color:#374151;font-size:13px;font-weight:600;cursor:pointer;">Cancel</button>
            <button type="button" onclick="confirmInsertQuillTable()"
                    style="padding:9px 22px;border:none;border-radius:8px;background:#2563eb;
                           color:#fff;font-size:13px;font-weight:700;cursor:pointer;
                           box-shadow:0 2px 10px rgba(37,99,235,.35);">Insert Table</button>
        </div>
    </div>
</div>

<script>
window.quillEditors = window.quillEditors || {};
window.activeQuillForTable = null;

function openQuillTableModal(quillInstance) {
    window.activeQuillForTable = quillInstance;
    document.getElementById('quill-table-modal').style.display = 'flex';
}
function closeQuillTableModal() {
    document.getElementById('quill-table-modal').style.display = 'none';
}

// ── Build table HTML with full inline styles ──────────────────────────────────
function buildTableHTML(rows, cols, hasHeader) {
    var html = '<table style="width:100%;border-collapse:collapse;border:1px solid #cbd5e1;font-size:14px;font-family:inherit;">';
    if (hasHeader) {
        html += '<thead><tr style="background:#f1f5f9;">';
        for (var c = 1; c <= cols; c++) {
            html += '<th contenteditable="true" style="border:1px solid #cbd5e1;padding:10px 14px;text-align:left;font-weight:600;color:#1e293b;background:#f1f5f9;min-width:90px;">Header ' + c + '</th>';
        }
        html += '</tr></thead>';
    }
    html += '<tbody>';
    for (var r = 1; r <= rows; r++) {
        var bg = (r % 2 === 0) ? '#f8fafc' : '#ffffff';
        html += '<tr style="background:' + bg + ';">';
        for (var c = 1; c <= cols; c++) {
            html += '<td contenteditable="true" style="border:1px solid #cbd5e1;padding:10px 14px;min-width:90px;vertical-align:top;background:' + bg + ';">Cell ' + r + '-' + c + '</td>';
        }
        html += '</tr>';
    }
    html += '</tbody></table>';
    return html;
}

// ── Insert table into the table zone (NOT into Quill) ─────────────────────────
function confirmInsertQuillTable() {
    var rows = parseInt(document.getElementById('quill-table-rows').value)  || 3;
    var cols  = parseInt(document.getElementById('quill-table-cols').value)   || 3;
    var hasHeader = document.getElementById('quill-table-header').checked;

    if (!window.activeQuillForTable) { closeQuillTableModal(); return; }

    var tid = window.activeQuillForTable.textareaId;
    var zone = document.getElementById('table-zone-' + tid);
    if (!zone) { closeQuillTableModal(); return; }

    // Build wrapper with delete button + table
    var wrap = document.createElement('div');
    wrap.className = 'pace-table-wrap';

    var delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'pace-table-delete';
    delBtn.title = 'Delete table';
    delBtn.innerHTML = '✕';
    delBtn.addEventListener('click', function() {
        wrap.parentNode.removeChild(wrap);
        syncEditorToTextarea(tid);
    });

    var overflow = document.createElement('div');
    overflow.style.cssText = 'overflow-x:auto;';
    overflow.innerHTML = buildTableHTML(rows, cols, hasHeader);

    wrap.appendChild(delBtn);
    wrap.appendChild(overflow);
    zone.appendChild(wrap);

    syncEditorToTextarea(tid);
    closeQuillTableModal();
}

// ── Sync quill + table zone → hidden textarea ─────────────────────────────────
function syncEditorToTextarea(textareaId) {
    var q    = window.quillEditors[textareaId];
    var zone = document.getElementById('table-zone-' + textareaId);
    var ta   = document.getElementById(textareaId);
    if (!ta) return;
    var quillHtml = q ? q.root.innerHTML : '';
    var tableHtml = zone ? zone.innerHTML : '';
    ta.value = quillHtml + tableHtml;
}
</script>
{% set quill_script_loaded = true %}
{% endif %}

<!-- ══════════ Init this editor instance ══════════ -->
<script>
(function() {
    var editorId   = 'quill-{{ field_id }}';
    var textareaId = '{{ field_id }}';
    var zoneId     = 'table-zone-{{ field_id }}';

    var quill = new Quill('#' + editorId, {
        theme: 'snow',
        modules: {
            toolbar: [
                [{ header: [1, 2, 3, 4, 5, 6, false] }],
                ['bold', 'italic', 'underline', 'strike'],
                [{ list: 'ordered' }, { list: 'bullet' }],
                [{ indent: '-1' }, { indent: '+1' }],
                [{ align: [] }],
                ['link', 'image', 'video'],
                [{ color: [] }, { background: [] }],
                ['blockquote', 'code-block'],
                ['clean']
            ]
        },
        placeholder: '{{ placeholder|default("Start writing here...") }}'
    });

    quill.textareaId = textareaId;
    window.quillEditors[textareaId] = quill;

    // ── Add "+ Table" button to toolbar ──────────────────────────────────────
    var toolbar = quill.getModule('toolbar').container;
    if (toolbar && !toolbar.querySelector('.ql-table-btn')) {
        var span = document.createElement('span');
        span.className = 'ql-formats';
        span.innerHTML =
            '<button type="button" class="ql-table-btn" title="Insert Table">' +
            '<svg viewBox="0 0 18 18" style="width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.5;vertical-align:middle;">' +
            '<rect x="2" y="2" width="14" height="14" rx="1.5"></rect>' +
            '<line x1="2" y1="7" x2="16" y2="7"></line>' +
            '<line x1="2" y1="12" x2="16" y2="12"></line>' +
            '<line x1="7" y1="2" x2="7" y2="16"></line>' +
            '<line x1="12" y1="2" x2="12" y2="16"></line>' +
            '</svg> + Table</button>';
        toolbar.appendChild(span);
        span.querySelector('.ql-table-btn').addEventListener('click', function() {
            openQuillTableModal(quill);
        });
    }

    // ── Load existing content ────────────────────────────────────────────────
    var existing = document.getElementById(textareaId).value;
    if (existing && existing.trim() && existing.trim() !== 'None') {
        var temp = document.createElement('div');
        temp.innerHTML = existing;
        var zone = document.getElementById(zoneId);

        // Helper: wrap a table node in a pace-table-wrap with delete button
        function wrapTable(tableHtml) {
            var wrap = document.createElement('div');
            wrap.className = 'pace-table-wrap';
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'pace-table-delete';
            btn.title = 'Delete table';
            btn.innerHTML = '✕';
            btn.addEventListener('click', function() {
                wrap.parentNode && wrap.parentNode.removeChild(wrap);
                syncEditorToTextarea(textareaId);
            });
            var overflow = document.createElement('div');
            overflow.style.cssText = 'overflow-x:auto;';
            overflow.innerHTML = tableHtml;
            wrap.appendChild(btn);
            wrap.appendChild(overflow);
            return wrap;
        }

        // 1. Restore previously saved pace-table-wraps
        Array.from(temp.querySelectorAll('.pace-table-wrap')).forEach(function(tw) {
            tw.parentNode.removeChild(tw);
            var btn = tw.querySelector('.pace-table-delete');
            if (btn) btn.addEventListener('click', function() {
                tw.parentNode && tw.parentNode.removeChild(tw);
                syncEditorToTextarea(textareaId);
            });
            zone.appendChild(tw);
        });

        // 2. Extract any remaining <table> elements (and their top-level wrapper)
        //    so Quill never sees table HTML and doesn't strip it
        Array.from(temp.querySelectorAll('table')).forEach(function(tbl) {
            // Walk up to find the direct child of temp
            var topNode = tbl;
            while (topNode.parentNode && topNode.parentNode !== temp) {
                topNode = topNode.parentNode;
            }
            if (topNode.parentNode === temp) {
                var tableHtml = topNode.tagName === 'TABLE'
                    ? topNode.outerHTML
                    : topNode.innerHTML; // unwrap div, keep table HTML inside
                topNode.parentNode.removeChild(topNode);
                zone.appendChild(wrapTable(tableHtml));
            }
        });

        // 3. Load text-only content into Quill (safe — no tables left)
        var cleanHtml = temp.innerHTML.trim();
        if (cleanHtml && cleanHtml !== '<p><br></p>') {
            quill.root.innerHTML = cleanHtml;
        }
    }

    // ── Sync on Quill text change ─────────────────────────────────────────────
    quill.on('text-change', function() {
        syncEditorToTextarea(textareaId);
    });

    // ── Sync on form submit ───────────────────────────────────────────────────
    var form = document.getElementById(textareaId).closest('form');
    if (form) {
        form.addEventListener('submit', function() {
            syncEditorToTextarea(textareaId);
        });
    }

    console.log('✅ Quill + Table Zone ready:', textareaId);
})();
</script>
