<!-- Reusable Quill Rich Text Editor Component -->
<!-- Usage: [include 'components/quill_editor.html' with {field_id: 'description', field_name: 'description', initial_value: course.description|default(''), height: '400px'}] -->

{% if not quill_loaded %}
<!-- Load Quill CSS (only once per page) -->
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<style>
.quill-editor-container {
    margin-bottom: 1rem;
}
.ql-editor {
    font-size: 15px;
    line-height: 1.6;
}
.ql-toolbar.ql-snow {
    border-radius: 8px 8px 0 0;
    background: #f9fafb;
    border-color: #d1d5db;
}
.ql-container.ql-snow {
    border-radius: 0 0 8px 8px;
    border-color: #d1d5db;
}
.ql-editor.ql-blank::before {
    color: #9ca3af;
    font-style: italic;
}

/* Sleek Light Gray Code Block Styling (Replacing Dark Black) */
.ql-editor pre,
.ql-editor pre.ql-syntax,
.ql-syntax,
pre {
    background-color: #f8fafc !important; /* Soft Light Gray */
    border: 1px solid #e2e8f0 !important;   /* Subtle Border */
    color: #1e293b !important;            /* Dark Slate Charcoal Text */
    border-radius: 10px !important;
    padding: 16px 20px !important;
    margin: 18px 0 !important;
    overflow-x: auto !important;
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace !important;
    font-size: 14.5px !important;
    line-height: 1.65 !important;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02) !important;
}

.ql-editor pre code,
.ql-editor pre.ql-syntax code,
pre code {
    background-color: transparent !important;
    border: none !important;
    padding: 0 !important;
    color: #1e293b !important;
    font-family: inherit !important;
    font-size: inherit !important;
}

/* 4 Signature Callout Box Side Colors (Green, Red, Yellow, Blue) */
blockquote[data-color="green"],
blockquote.callout-green,
blockquote[style*="#16a34a"],
blockquote[style*="rgb(22, 163, 74)"] {
    border-left: 5px solid #16a34a !important;
    background-color: #f0fdf4 !important;
    color: #14532d !important;
    padding: 14px 18px !important;
    margin: 16px 0 !important;
    border-radius: 0 10px 10px 0 !important;
    display: block !important;
}

blockquote[data-color="red"],
blockquote.callout-red,
blockquote[style*="#dc2626"],
blockquote[style*="rgb(220, 38, 38)"] {
    border-left: 5px solid #dc2626 !important;
    background-color: #fef2f2 !important;
    color: #7f1d1d !important;
    padding: 14px 18px !important;
    margin: 16px 0 !important;
    border-radius: 0 10px 10px 0 !important;
    display: block !important;
}

blockquote[data-color="yellow"],
blockquote.callout-yellow,
blockquote[style*="#d97706"],
blockquote[style*="rgb(217, 119, 6)"] {
    border-left: 5px solid #d97706 !important;
    background-color: #fffbeb !important;
    color: #78350f !important;
    padding: 14px 18px !important;
    margin: 16px 0 !important;
    border-radius: 0 10px 10px 0 !important;
    display: block !important;
}

blockquote[data-color="blue"],
blockquote.callout-blue,
blockquote[style*="#2563eb"],
blockquote[style*="rgb(37, 99, 235)"],
blockquote:not([data-color]):not([class*="callout"]):not([style*="border-left"]) {
    border-left: 5px solid #2563eb !important;
    background-color: #eff6ff !important;
    color: #1e3a8a !important;
    padding: 14px 18px !important;
    margin: 16px 0 !important;
    border-radius: 0 10px 10px 0 !important;
    display: block !important;
}
</style>
{% set quill_loaded = true %}
{% endif %}

<!-- Quick Callout Color Toolbar -->
<div class="flex items-center space-x-2 mb-2 flex-wrap gap-y-1">
    <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Side Callout Boxes:</span>
    <button type="button" onclick="insertCallout('quill-{{ field_id }}', 'blue')"
        class="px-2.5 py-1 text-xs font-semibold bg-blue-50 text-blue-700 border-l-4 border-blue-600 rounded-r hover:bg-blue-100 transition-colors shadow-sm">
        🔷 Blue Tip
    </button>
    <button type="button" onclick="insertCallout('quill-{{ field_id }}', 'green')"
        class="px-2.5 py-1 text-xs font-semibold bg-green-50 text-green-700 border-l-4 border-green-600 rounded-r hover:bg-green-100 transition-colors shadow-sm">
        🟢 Green Takeaway
    </button>
    <button type="button" onclick="insertCallout('quill-{{ field_id }}', 'red')"
        class="px-2.5 py-1 text-xs font-semibold bg-red-50 text-red-700 border-l-4 border-red-600 rounded-r hover:bg-red-100 transition-colors shadow-sm">
        🔴 Red Warning
    </button>
    <button type="button" onclick="insertCallout('quill-{{ field_id }}', 'yellow')"
        class="px-2.5 py-1 text-xs font-semibold bg-amber-50 text-amber-800 border-l-4 border-amber-500 rounded-r hover:bg-amber-100 transition-colors shadow-sm">
        🟡 Yellow Note
    </button>
</div>

<!-- Editor Container -->
<div class="quill-editor-container">
    <div id="quill-{{ field_id }}" style="height: {{ height|default('300px') }};"></div>
    <textarea id="{{ field_id }}" name="{{ field_name }}" class="hidden">{% if initial_value and initial_value is not none and initial_value != 'None' %}{{ initial_value }}{% endif %}</textarea>
</div>

{% if not quill_script_loaded %}
<!-- Load Quill JS (only once per page) -->
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
// Store all Quill instances
window.quillEditors = window.quillEditors || {};
window.quillInstances = window.quillInstances || {};

// Register data-color attribute on Quill Parchment so Quill never strips it!
if (window.Quill) {
    try {
        var Parchment = Quill.import('parchment');
        var DataColor = new Parchment.Attributor.Attribute('data-color', 'data-color', {
            scope: Parchment.Scope.BLOCK
        });
        Quill.register(DataColor, true);
    } catch(e) {
        console.log('Quill Parchment registration:', e);
    }
}

window.insertCallout = function(editorId, color) {
    var quill = window.quillInstances[editorId];
    if (!quill) return;
    var range = quill.getSelection(true);
    var index = range ? range.index : quill.getLength();
    
    var styleMap = {
        'blue': 'border-left: 5px solid #2563eb !important; background: #eff6ff !important; color: #1e3a8a !important; padding: 14px 18px !important; margin: 16px 0 !important; border-radius: 0 10px 10px 0 !important;',
        'green': 'border-left: 5px solid #16a34a !important; background: #f0fdf4 !important; color: #14532d !important; padding: 14px 18px !important; margin: 16px 0 !important; border-radius: 0 10px 10px 0 !important;',
        'red': 'border-left: 5px solid #dc2626 !important; background: #fef2f2 !important; color: #7f1d1d !important; padding: 14px 18px !important; margin: 16px 0 !important; border-radius: 0 10px 10px 0 !important;',
        'yellow': 'border-left: 5px solid #d97706 !important; background: #fffbeb !important; color: #78350f !important; padding: 14px 18px !important; margin: 16px 0 !important; border-radius: 0 10px 10px 0 !important;'
    };
    
    var selectedStyle = styleMap[color] || styleMap['blue'];
    var calloutHtml = '<blockquote data-color="' + color + '" class="callout-' + color + '" style="' + selectedStyle + '"><p>Type your ' + color + ' callout message here...</p></blockquote><p><br></p>';
    
    quill.clipboard.dangerouslyPasteHTML(index, calloutHtml);
};
</script>
{% set quill_script_loaded = true %}
{% endif %}

<!-- Initialize this specific editor -->
<script>
(function() {
    var editorId = 'quill-{{ field_id }}';
    var textareaId = '{{ field_id }}';
    
    // Initialize Quill
    var quill = new Quill('#' + editorId, {
        theme: 'snow',
        modules: {
            toolbar: [
                [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
                ['bold', 'italic', 'underline', 'strike'],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                [{ 'indent': '-1'}, { 'indent': '+1' }],
                [{ 'align': [] }],
                ['link', 'image', 'video'],
                [{ 'color': [] }, { 'background': [] }],
                ['blockquote', 'code-block'],
                ['clean']
            ]
        },
        placeholder: '{{ placeholder|default("Start writing here...") }}'
    });
    
    // Store instance
    window.quillEditors[textareaId] = quill;
    window.quillInstances[editorId] = quill;
    
    // Load existing content
    var existingContent = document.getElementById(textareaId).value;
    if (existingContent && existingContent.trim() !== 'None') {
        quill.root.innerHTML = existingContent;
    }
    
    // Sync content to hidden textarea on change
    quill.on('text-change', function() {
        document.getElementById(textareaId).value = quill.root.innerHTML;
    });
    
    // Also sync on form submit
    var form = document.getElementById(textareaId).closest('form');
    if (form) {
        form.addEventListener('submit', function() {
            document.getElementById(textareaId).value = quill.root.innerHTML;
        });
    }
    
    console.log('✅ Quill editor initialized:', textareaId);
})();
</script>
