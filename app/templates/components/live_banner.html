{% if sidebar_counts and sidebar_counts.has_active_live and sidebar_counts.active_live_session %}
{% set s = sidebar_counts.active_live_session %}
<div class="mb-6 bg-gradient-to-r from-gray-900 via-indigo-950 to-gray-950 p-4 sm:p-5 rounded-3xl border-2 border-red-500/50 shadow-xl flex items-center justify-between gap-4 text-white relative overflow-hidden animate-pulse">
    <div class="flex items-center space-x-3.5 min-w-0 z-10">
        <span class="px-3 py-1 bg-red-600 text-white font-black text-[10px] uppercase tracking-wider rounded-full shrink-0 flex items-center space-x-1.5 shadow-md">
            <span class="w-2 h-2 rounded-full bg-white animate-ping"></span>
            <span>LIVE NOW</span>
        </span>
        <div class="min-w-0">
            <h4 class="text-sm sm:text-base font-extrabold text-white truncate">{{ s.title }}</h4>
            <p class="text-xs text-gray-300 truncate font-medium">{{ s.course.title }} • Host: {{ s.creator.full_name }}</p>
        </div>
    </div>
    <a href="{{ url_for('student.join_live_room', session_id=s.id) }}"
       class="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-black text-xs rounded-xl shadow-lg transition shrink-0 flex items-center space-x-1.5 z-10">
        <i class="fas fa-video"></i>
        <span>Join Live Classroom ↗</span>
    </a>
</div>
{% endif %}
