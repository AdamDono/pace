<!-- Client-Side 20-Minute Inactivity Lockout Component -->
{% if current_user and current_user.is_authenticated %}
<div id="inactivityModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center z-[99999] p-4 transition-all duration-300">
    <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl border border-gray-100 text-center animate-bounce-short">
        <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl font-bold shadow-sm">
            ⏳
        </div>
        <h3 class="text-xl font-extrabold text-gray-900 mb-2">Inactivity Session Warning</h3>
        <p class="text-sm text-gray-600 mb-4 leading-relaxed">
            You have been inactive for 8 hours and 59 minutes. For security, your session will automatically lock out in <span id="inactivityCountdown" class="font-black text-red-600 font-mono text-base">60</span> seconds.
        </p>
        <div class="w-full bg-gray-100 rounded-full h-2 mb-6 overflow-hidden">
            <div id="inactivityProgress" class="bg-amber-500 h-2 rounded-full transition-all duration-1000" style="width: 100%;"></div>
        </div>
        <div class="flex items-center justify-center gap-3">
            <button onclick="extendSession()" class="w-full py-3.5 px-6 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-extrabold text-sm rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
                <span>⚡ Keep Me Logged In</span>
            </button>
        </div>
    </div>
</div>

<script>
(function() {
    const INACTIVITY_LIMIT_MS = 9 * 60 * 60 * 1000; // 9 hours total
    const WARNING_TIME_MS = INACTIVITY_LIMIT_MS - (60 * 1000); // Warn 60 seconds before limit
    
    let lastActivityTime = Date.now();
    let warningTimer = null;
    let logoutTimer = null;
    let countdownInterval = null;
    let remainingSeconds = 60;
    
    const events = ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'];
    
    function resetActivity() {
        // Only reset if modal is NOT open (to avoid auto-dismissing warning silently)
        const modal = document.getElementById('inactivityModal');
        if (modal && !modal.classList.contains('hidden')) return;
        
        lastActivityTime = Date.now();
        scheduleTimers();
    }
    
    function scheduleTimers() {
        clearTimeout(warningTimer);
        clearTimeout(logoutTimer);
        clearInterval(countdownInterval);
        
        const elapsed = Date.now() - lastActivityTime;
        const timeUntilWarning = WARNING_TIME_MS - elapsed;
        const timeUntilLogout = INACTIVITY_LIMIT_MS - elapsed;
        
        if (timeUntilLogout <= 0) {
            triggerLogout();
            return;
        }
        
        if (timeUntilWarning <= 0) {
            showWarningModal();
        } else {
            warningTimer = setTimeout(showWarningModal, timeUntilWarning);
        }
        
        logoutTimer = setTimeout(triggerLogout, timeUntilLogout);
    }
    
    function showWarningModal() {
        const modal = document.getElementById('inactivityModal');
        if (modal) modal.classList.remove('hidden');
        
        remainingSeconds = 60;
        const countSpan = document.getElementById('inactivityCountdown');
        const progressBar = document.getElementById('inactivityProgress');
        
        if (countSpan) countSpan.textContent = remainingSeconds;
        if (progressBar) progressBar.style.width = '100%';
        
        clearInterval(countdownInterval);
        countdownInterval = setInterval(function() {
            remainingSeconds--;
            if (countSpan) countSpan.textContent = remainingSeconds;
            if (progressBar) progressBar.style.width = Math.max(0, (remainingSeconds / 60) * 100) + '%';
            
            if (remainingSeconds <= 0) {
                clearInterval(countdownInterval);
                triggerLogout();
            }
        }, 1000);
    }
    
    window.extendSession = function() {
        fetch('/auth/ping-session', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('meta[name="csrf-token"]')?.content || ''
            }
        })
        .then(() => {
            const modal = document.getElementById('inactivityModal');
            if (modal) modal.classList.add('hidden');
            lastActivityTime = Date.now();
            scheduleTimers();
        })
        .catch(err => {
            console.error('Session refresh error:', err);
            window.location.href = '/login?reason=inactivity';
        });
    };
    
    function triggerLogout() {
        window.location.href = '/login?reason=inactivity';
    }
    
    // Attach user activity listeners
    events.forEach(evt => {
        window.addEventListener(evt, resetActivity, { passive: true });
    });
    
    // Start timers on load
    scheduleTimers();
})();
</script>
{% endif %}
