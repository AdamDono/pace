{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto p-6">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold">Create Assignment</h1>
            <p class="text-gray-600">Add an assignment to: {{ section.title }}</p>
        </div>
        <a href="{{ url_for('teacher.course_builder', course_id=course.id) }}"
            class="text-gray-600 hover:text-gray-900">
            ← Back to Builder
        </a>
    </div>

    <div class="bg-white rounded-lg shadow-lg p-6">
        <form method="POST">
            {{ form.hidden_tag() }}

            <div class="space-y-6">
                <!-- Title -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Assignment Title</label>
                    <input type="text" name="title" value="{{ form.title.data or '' }}" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <!-- Instructions -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Instructions</label>
                    <div id="editor" style="height: 250px;"></div>
                    <textarea name="description" id="description"
                        class="hidden">{{ form.description.data or '' }}</textarea>
                </div>

                <!-- Settings Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Submission Type</label>
                        <select name="submission_type" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                            <option value="text">Text Entry</option>
                            <option value="file">File Upload</option>
                            <option value="code">Code Submission</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Due Date (Optional)</label>
                        <input type="datetime-local" name="due_date"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    </div>
                </div>

                <div class="pt-6 border-t border-gray-200 flex justify-end space-x-3">
                    <a href="{{ url_for('teacher.course_builder', course_id=course.id) }}"
                        class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors">
                        Cancel
                    </a>
                    <button type="submit"
                        class="px-8 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors font-medium">
                        Create Assignment
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Quill -->
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
    var quill = new Quill('#editor', {
        theme: 'snow',
        modules: {
            toolbar: [
                ['bold', 'italic', 'underline'],
                [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                ['link'],
                ['clean']
            ]
        },
        placeholder: 'Enter assignment details and instructions...'
    });

    const description = document.getElementById('description');
    if (description.value) {
        quill.root.innerHTML = description.value;
    }

    document.querySelector('form').addEventListener('submit', function () {
        description.value = quill.root.innerHTML;
    });
</script>
{% endblock %}
