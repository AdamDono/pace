{% extends "teacher/base_teacher.html" %}
{% block page_title %}{{ 'Edit Quiz' if quiz else 'Add Quiz' }}{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto p-6">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold">{{ 'Edit Quiz' if quiz else 'Create Quiz' }}</h1>
            <p class="text-gray-600">Quiz for section: {{ section.title }}</p>
        </div>
        <a href="{{ url_for('teacher.course_builder', course_id=course.id) }}"
            class="text-gray-600 hover:text-gray-900">
            ← Back to Builder
        </a>
    </div>

    <div class="bg-white rounded-lg shadow-lg p-6">
        <form method="POST" id="quiz-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- Basic Settings -->
            <div class="mb-8 p-4 bg-gray-50 rounded-lg border border-gray-200">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Quiz Title</label>
                    <input type="text" name="title" value="{{ quiz.title if quiz else 'New Quiz' }}" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <div class="flex flex-wrap items-center gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Pass Score (%)</label>
                        <input type="number" name="passing_score" value="{{ quiz.passing_score|round(0)|int if quiz and quiz.passing_score is not none else 60 }}" min="0" max="100" step="any"
                            class="w-24 px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Time Limit (min)</label>
                        <input type="number" name="time_limit" value="{{ quiz.time_limit or '' if quiz else '' }}" placeholder="Unlimited" step="1"
                            class="w-32 px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Max Attempts</label>
                        <input type="number" name="max_attempts" value="{{ quiz.max_attempts or 3 if quiz else 3 }}" min="1" max="50" step="1"
                            class="w-28 px-3 py-2 border rounded-lg">
                    </div>
                </div>
            </div>

            <!-- Questions Builder -->
            <div id="questions-container" class="space-y-6">
                <!-- Questions will be added here via JS -->
            </div>

            <div class="mt-6 flex flex-wrap justify-center gap-3">
                <button type="button" onclick="addQuestion()"
                    class="px-6 py-2.5 border-2 border-dashed border-blue-300 text-blue-600 rounded-lg hover:bg-blue-50 transition-colors flex items-center font-medium">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    + Add Question
                </button>
                <button type="button" onclick="addMultipleQuestions(5)"
                    class="px-5 py-2.5 border-2 border-dashed border-indigo-300 text-indigo-600 rounded-lg hover:bg-indigo-50 transition-colors flex items-center font-medium text-sm">
                    + Add 5 Questions at Once
                </button>
            </div>

            <div class="pt-8 border-t border-gray-200 mt-8 flex justify-end space-x-3">
                <a href="{{ url_for('teacher.course_builder', course_id=course.id) }}"
                    class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors">
                    Cancel
                </a>
                <button type="submit"
                    class="px-8 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium">
                    Save Quiz
                </button>
            </div>
        </form>
    </div>
</div>

<template id="question-template">
    <div class="question-block bg-white border border-gray-200 rounded-lg p-6 relative hover:shadow-md transition-shadow">
        <button type="button" onclick="removeQuestion(this)"
            class="absolute top-4 right-4 text-gray-400 hover:text-red-500 p-1 rounded" title="Remove question">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>

        <div class="flex flex-wrap items-center justify-between gap-2 mb-3 pr-8">
            <div class="flex items-center gap-2">
                <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded question-number">Q1</span>
                <span class="text-xs text-gray-500 question-hint">Select the correct option below</span>
            </div>
            <div class="flex items-center gap-2">
                <label class="text-xs font-medium text-gray-600">Answer Type:</label>
                <select name="questions[][qtype]" onchange="toggleQuestionMode(this)"
                    class="question-type-select text-xs bg-gray-50 border border-gray-300 text-gray-700 rounded-lg px-2.5 py-1 focus:ring-1 focus:ring-blue-500">
                    <option value="multiple_choice">Single Correct Answer</option>
                    <option value="multi_select">Multiple Correct Answers (Select all that apply)</option>
                </select>
            </div>
        </div>

        <div class="mb-4">
            <input type="text" name="questions[][text]" placeholder="Enter your question here..." required
                class="w-full px-4 py-2 border-b-2 border-gray-200 focus:border-blue-500 outline-none transition-colors text-lg font-medium">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pl-2">
            <div class="flex items-center">
                <input type="radio" name="questions[][correct]" value="a" class="correct-selector mt-1 mr-2.5 w-4 h-4 text-blue-600 cursor-pointer" checked>
                <input type="text" name="questions[][a]" placeholder="Option A" required
                    class="flex-1 px-3 py-2 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500">
            </div>
            <div class="flex items-center">
                <input type="radio" name="questions[][correct]" value="b" class="correct-selector mt-1 mr-2.5 w-4 h-4 text-blue-600 cursor-pointer">
                <input type="text" name="questions[][b]" placeholder="Option B" required
                    class="flex-1 px-3 py-2 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500">
            </div>
            <div class="flex items-center">
                <input type="radio" name="questions[][correct]" value="c" class="correct-selector mt-1 mr-2.5 w-4 h-4 text-blue-600 cursor-pointer">
                <input type="text" name="questions[][c]" placeholder="Option C (Optional)"
                    class="flex-1 px-3 py-2 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500">
            </div>
            <div class="flex items-center">
                <input type="radio" name="questions[][correct]" value="d" class="correct-selector mt-1 mr-2.5 w-4 h-4 text-blue-600 cursor-pointer">
                <input type="text" name="questions[][d]" placeholder="Option D (Optional)"
                    class="flex-1 px-3 py-2 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500">
            </div>
        </div>
    </div>
</template>

<script>
    let questionIndex = 0;

    function toggleQuestionMode(selectEl) {
        const block = selectEl.closest('.question-block');
        const isMulti = selectEl.value === 'multi_select';
        const selectors = block.querySelectorAll('.correct-selector');
        const hint = block.querySelector('.question-hint');

        selectors.forEach(inp => {
            inp.type = isMulti ? 'checkbox' : 'radio';
        });

        // Ensure at least one option stays checked
        const anyChecked = Array.from(selectors).some(i => i.checked);
        if (!anyChecked && selectors.length > 0) {
            selectors[0].checked = true;
        }

        if (hint) {
            hint.textContent = isMulti
                ? '✓ Tick ALL correct options for this question'
                : 'Select the single correct option below';
            hint.className = isMulti
                ? 'text-xs font-semibold text-indigo-600 question-hint'
                : 'text-xs text-gray-500 question-hint';
        }
    }

    function addQuestion(initialData = null) {
        questionIndex++;
        const q_id = 'q_' + questionIndex + '_' + Math.random().toString(36).substring(2, 6);
        const container = document.getElementById('questions-container');
        const template = document.getElementById('question-template');
        const clone = template.content.cloneNode(true);

        const rawCorrect = initialData && initialData.correct_answer ? String(initialData.correct_answer) : 'a';
        const correctList = rawCorrect.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
        const isMulti = (initialData && initialData.question_type === 'multi_select') || correctList.length > 1;

        const qtypeSelect = clone.querySelector('.question-type-select');
        qtypeSelect.name = `${q_id}_qtype`;
        qtypeSelect.value = isMulti ? 'multi_select' : 'multiple_choice';

        const hint = clone.querySelector('.question-hint');
        if (hint && isMulti) {
            hint.textContent = '✓ Tick ALL correct options for this question';
            hint.className = 'text-xs font-semibold text-indigo-600 question-hint';
        }

        const selectors = clone.querySelectorAll('.correct-selector');
        selectors.forEach(sel => {
            sel.name = `${q_id}_correct`;
            sel.type = isMulti ? 'checkbox' : 'radio';
            sel.checked = correctList.includes(sel.value);
        });

        const textInputs = clone.querySelectorAll('input[type="text"]');
        textInputs.forEach(input => {
            if (input.name.includes('[text]')) {
                input.name = `${q_id}_text`;
                if (initialData) input.value = initialData.question_text || '';
            }
            if (input.name.includes('[a]')) {
                input.name = `${q_id}_a`;
                if (initialData) input.value = initialData.option_a || '';
            }
            if (input.name.includes('[b]')) {
                input.name = `${q_id}_b`;
                if (initialData) input.value = initialData.option_b || '';
            }
            if (input.name.includes('[c]')) {
                input.name = `${q_id}_c`;
                if (initialData) input.value = initialData.option_c || '';
            }
            if (input.name.includes('[d]')) {
                input.name = `${q_id}_d`;
                if (initialData) input.value = initialData.option_d || '';
            }
        });

        const totalBlocks = document.querySelectorAll('.question-block').length + 1;
        clone.querySelector('.question-number').textContent = `Q${totalBlocks}`;

        container.appendChild(clone);
    }

    function addMultipleQuestions(count) {
        for (let i = 0; i < count; i++) {
            addQuestion();
        }
    }

    function removeQuestion(btn) {
        if (document.querySelectorAll('.question-block').length > 1) {
            btn.closest('.question-block').remove();
            let idx = 1;
            document.querySelectorAll('.question-number').forEach(span => {
                span.textContent = `Q${idx++}`;
            });
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        {% if quiz and quiz.questions %}
            {% for q in quiz.questions %}
                addQuestion({
                    question_text: {{ q.question_text|tojson }},
                    option_a: {{ q.option_a|tojson }},
                    option_b: {{ q.option_b|tojson }},
                    option_c: {{ q.option_c|tojson or ''|tojson }},
                    option_d: {{ q.option_d|tojson or ''|tojson }},
                    correct_answer: {{ q.correct_answer|tojson }},
                    question_type: {{ (q.question_type or 'multiple_choice')|tojson }}
                });
            {% endfor %}
        {% else %}
            addQuestion();
        {% endif %}
    });
</script>
{% endblock %}
