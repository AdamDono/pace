{% extends "teacher/base_teacher.html" %}
{% block page_title %}Add Quiz{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto p-6">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold">Create Quiz</h1>
            <p class="text-gray-600">Add a quiz to: {{ section.title }}</p>
        </div>
        <a href="{{ url_for('teacher.course_builder', course_id=course.id) }}"
            class="text-gray-600 hover:text-gray-900">
            ← Back to Builder
        </a>
    </div>

    <div class="bg-white rounded-lg shadow-lg p-6">
        <form method="POST" id="quiz-form">
            {{ form.hidden_tag() }}

            <!-- Basic Settings -->
            <div class="mb-8 p-4 bg-gray-50 rounded-lg border border-gray-200">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Quiz Title</label>
                    <input type="text" name="title" value="{{ form.title.data or 'New Quiz' }}" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <div class="flex items-center space-x-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Pass Score (%)</label>
                        <input type="number" name="passing_score" value="60" min="0" max="100"
                            class="w-24 px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Time Limit (min)</label>
                        <input type="number" name="time_limit" placeholder="Unlimited"
                            class="w-32 px-3 py-2 border rounded-lg">
                    </div>
                </div>
            </div>

            <!-- Questions Builder -->
            <div id="questions-container" class="space-y-6">
                <!-- Questions will be added here via JS -->
            </div>

            <div class="mt-6 flex justify-center">
                <button type="button" onclick="addQuestion()"
                    class="px-6 py-2 border-2 border-dashed border-blue-300 text-blue-600 rounded-lg hover:bg-blue-50 transition-colors flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    Add Question
                </button>
            </div>

            <div class="pt-8 border-t border-gray-200 mt-8 flex justify-end space-x-3">
                <a href="{{ url_for('teacher.course_builder', course_id=course.id) }}"
                    class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors">
                    Cancel
                </a>
                <button type="submit"
                    class="px-8 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium">
                    Save Quiz
                </button>
            </div>
        </form>
    </div>
</div>

<template id="question-template">
    <div
        class="question-block bg-white border border-gray-200 rounded-lg p-6 relative hover:shadow-md transition-shadow">
        <button type="button" onclick="removeQuestion(this)"
            class="absolute top-4 right-4 text-gray-400 hover:text-red-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>

        <div class="flex items-center mb-4">
            <span
                class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded mr-2 question-number">Q1</span>
            <input type="text" name="questions[][text]" placeholder="Enter your question here..." required
                class="flex-1 px-4 py-2 border-b-2 border-gray-200 focus:border-blue-500 outline-none transition-colors text-lg font-medium">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pl-4">
            <div class="flex items-center">
                <input type="radio" name="questions[][correct]" value="a" class="mt-1 mr-2 text-blue-600" checked>
                <input type="text" name="questions[][a]" placeholder="Option A" required
                    class="flex-1 px-3 py-2 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500">
            </div>
            <div class="flex items-center">
                <input type="radio" name="questions[][correct]" value="b" class="mt-1 mr-2 text-blue-600">
                <input type="text" name="questions[][b]" placeholder="Option B" required
                    class="flex-1 px-3 py-2 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500">
            </div>
            <div class="flex items-center">
                <input type="radio" name="questions[][correct]" value="c" class="mt-1 mr-2 text-blue-600">
                <input type="text" name="questions[][c]" placeholder="Option C (Optional)"
                    class="flex-1 px-3 py-2 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500">
            </div>
            <div class="flex items-center">
                <input type="radio" name="questions[][correct]" value="d" class="mt-1 mr-2 text-blue-600">
                <input type="text" name="questions[][d]" placeholder="Option D (Optional)"
                    class="flex-1 px-3 py-2 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500">
            </div>
        </div>
    </div>
</template>

<script>
    let questionCount = 0;

    function addQuestion() {
        questionCount++;
        const container = document.getElementById('questions-container');
        const template = document.getElementById('question-template');
        const clone = template.content.cloneNode(true);

        // Update index for names to group them correctly in backend if needed
        // For simplicity, we use array notation and will process in order on backend
        // Ideally we need unique indices for radio buttons so groups don't conflict
        const timestamp = Date.now();

        const radioButtons = clone.querySelectorAll('input[type="radio"]');
        radioButtons.forEach(radio => {
            radio.name = `q_${timestamp}_correct`; // Unique name per question group
        });

        // Set text inputs to belong to this group as well
        const textInputs = clone.querySelectorAll('input[type="text"]');
        textInputs.forEach(input => {
            if (input.name.includes('[text]')) input.name = `q_${timestamp}_text`;
            if (input.name.includes('[a]')) input.name = `q_${timestamp}_a`;
            if (input.name.includes('[b]')) input.name = `q_${timestamp}_b`;
            if (input.name.includes('[c]')) input.name = `q_${timestamp}_c`;
            if (input.name.includes('[d]')) input.name = `q_${timestamp}_d`;
        });

        clone.querySelector('.question-number').textContent = `Q${questionCount}`;

        container.appendChild(clone);
    }

    function removeQuestion(btn) {
        if (document.querySelectorAll('.question-block').length > 1) {
            btn.closest('.question-block').remove();
            // Renumber
            let idx = 1;
            document.querySelectorAll('.question-number').forEach(span => {
                span.textContent = `Q${idx++}`;
            });
            questionCount--;
        }
    }

    // Add first question by default
    document.addEventListener('DOMContentLoaded', () => {
        addQuestion();
    });
</script>
{% endblock %}
