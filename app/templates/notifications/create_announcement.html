{% extends "base.html" %}

{% block title %}Create Announcement{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-3xl font-bold text-gray-900">Create Course Announcement</h1>
            <p class="text-gray-600 mt-2">{{ course.title }}</p>
        </div>
        <a href="{{ url_for('teacher.manage_modules', course_id=course.id) }}" 
           class="text-gray-600 hover:text-blue-600 flex items-center">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Back to Course
        </a>
    </div>

    <div class="bg-white rounded-lg shadow-lg p-8">
        <form method="POST" data-loading="Creating announcement...">
            <div class="space-y-6">
                <!-- Title -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Announcement Title *
                    </label>
                    <input type="text" name="title" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="e.g., Class Cancelled Tomorrow, New Assignment Posted, Quiz Reminder">
                </div>

                <!-- Content -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Announcement Content *
                    </label>
                    <div id="announcement-content-editor" style="height: 400px;"></div>
                    <textarea id="announcement-content" name="content" class="hidden" required></textarea>
                </div>

                <!-- Options -->
                <div class="bg-gray-50 rounded-lg p-6 space-y-4">
                    <h3 class="font-semibold text-gray-900 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        Notification Options
                    </h3>

                    <div class="flex items-start">
                        <input type="checkbox" name="send_email" id="send_email" checked
                               class="mt-1 h-5 w-5 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                        <label for="send_email" class="ml-3">
                            <span class="block font-medium text-gray-900">📧 Send Email Notification</span>
                            <span class="block text-sm text-gray-600">All enrolled students will receive an email</span>
                        </label>
                    </div>

                    <div class="flex items-start">
                        <input type="checkbox" name="pinned" id="pinned"
                               class="mt-1 h-5 w-5 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                        <label for="pinned" class="ml-3">
                            <span class="block font-medium text-gray-900">📌 Pin Announcement</span>
                            <span class="block text-sm text-gray-600">Keep this announcement at the top of the list</span>
                        </label>
                    </div>
                </div>

                <!-- Preview Stats -->
                <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded">
                    <div class="flex">
                        <div class="flex-shrink-0">
                            <svg class="h-5 w-5 text-blue-500" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                            </svg>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm text-blue-700">
                                <strong>{{ enrollments|length }}</strong> students will be notified
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex items-center justify-between pt-6 border-t border-gray-200">
                    <a href="{{ url_for('teacher.manage_modules', course_id=course.id) }}" 
                       class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors">
                        Cancel
                    </a>
                    <div class="flex space-x-4">
                        <button type="button" onclick="previewAnnouncement()" 
                                class="px-6 py-3 border-2 border-blue-600 text-blue-600 rounded-lg hover:bg-blue-50 transition-colors">
                            👁️ Preview
                        </button>
                        <button type="submit" 
                                class="px-6 py-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-lg hover:from-blue-700 hover:to-purple-700 transition-colors font-medium shadow-lg">
                            📢 Post Announcement
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Quill Rich Text Editor -->
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<style>
.ql-editor {
    font-size: 15px;
    line-height: 1.6;
    min-height: 350px;
}
.ql-toolbar.ql-snow {
    border-radius: 8px 8px 0 0;
    background: #f9fafb;
}
.ql-container.ql-snow {
    border-radius: 0 0 8px 8px;
}
</style>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
// Initialize Quill for announcement content
var announcementQuill = new Quill('#announcement-content-editor', {
    theme: 'snow',
    modules: {
        toolbar: [
            [{ 'header': [1, 2, 3, false] }],
            ['bold', 'italic', 'underline', 'strike'],
            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
            ['link'],
            [{ 'color': [] }, { 'background': [] }],
            ['blockquote'],
            ['clean']
        ]
    },
    placeholder: 'Write your announcement here. You can format text, add links, and create lists...'
});

// Sync Quill content to hidden textarea
announcementQuill.on('text-change', function() {
    document.getElementById('announcement-content').value = announcementQuill.root.innerHTML;
});

// Sync on form submit
document.querySelector('form').addEventListener('submit', function() {
    document.getElementById('announcement-content').value = announcementQuill.root.innerHTML;
});

// Preview function
function previewAnnouncement() {
    const title = document.querySelector('input[name="title"]').value;
    const content = announcementQuill.root.innerHTML;
    
    if (!title || !content || content === '<p><br></p>') {
        alert('Please enter a title and content first.');
        return;
    }
    
    const previewWindow = window.open('', 'Announcement Preview', 'width=800,height=600');
    previewWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>Preview: ${title}</title>
            <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
        </head>
        <body class="bg-gray-100 p-8">
            <div class="max-w-3xl mx-auto bg-white rounded-lg shadow-lg p-8">
                <div class="mb-4 text-sm text-gray-500">
                    📢 Announcement Preview
                </div>
                <h1 class="text-2xl font-bold text-gray-900 mb-4">${title}</h1>
                <div class="prose max-w-none">
                    ${content}
                </div>
                <div class="mt-8 pt-6 border-t border-gray-200 text-sm text-gray-500">
                    This is a preview. Close this window to continue editing.
                </div>
            </div>
        </body>
        </html>
    `);
}

console.log('✅ Quill editor initialized for announcement');
</script>
{% endblock %}
