{% extends "base.html" %}
{% block content %}
<div class="container mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4">My Courses</h1>
    {% if courses %}
        <ul class="space-y-2">
            {% for course in courses %}
                <li class="border p-3 rounded">
                    <a href="{{ url_for('student.course_detail', course_id=course.id) }}" class="text-blue-600 hover:underline">{{ course.title }}</a>
                    <span class="ml-4 text-sm text-gray-500">Created: {{ course.created_at|datetimeformat('medium') }}</span>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No enrolled courses yet.</p>
    {% endif %}
    <a href="{{ url_for('auth.logout') }}" class="mt-4 block text-blue-600 hover:underline">Logout</a>
</div>
{% endblock %}
