<!-- Modern Video Player with Interactive Features -->
<div class="video-player-container bg-black rounded-lg overflow-hidden shadow-2xl" id="video-container-{{ section.id }}">
    <!-- Video Element -->
    <div class="relative">
        <video 
            id="video-player-{{ section.id }}" 
            class="w-full"
            preload="metadata"
            {% if subtitles %}crossorigin="anonymous"{% endif %}
        >
            {% if section.video_url %}
                <source src="{{ section.video_url }}" type="video/mp4">
            {% elif section.media_file %}
                <source src="{{ url_for('static', filename='uploads/' + section.media_file) }}" type="video/mp4">
            {% endif %}
            
            <!-- Subtitles/Captions -->
            {% for subtitle in section.subtitles %}
            <track 
                kind="subtitles" 
                src="{{ url_for('static', filename='uploads/subtitles/' + subtitle.subtitle_file) }}"
                srclang="{{ subtitle.language }}" 
                label="{{ subtitle.language_name }}"
                {% if subtitle.is_default %}default{% endif %}
            >
            {% endfor %}
            
            Your browser does not support the video tag.
        </video>
        
        <!-- Interactive Question Overlay -->
        <div id="interactive-question-overlay-{{ section.id }}" 
             class="absolute inset-0 bg-black bg-opacity-90 hidden flex items-center justify-center z-50">
            <div class="bg-white rounded-xl p-8 max-w-2xl w-full mx-4 shadow-2xl" id="question-card-{{ section.id }}">
                <!-- Question content will be injected here -->
            </div>
        </div>
        
        <!-- Loading Spinner -->
        <div id="video-loading-{{ section.id }}" 
             class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-white"></div>
        </div>
    </div>
    
    <!-- Custom Controls -->
    <div class="bg-gradient-to-t from-black to-transparent px-4 py-3">
        <!-- Progress Bar -->
        <div class="mb-3">
            <div class="relative h-2 bg-gray-700 rounded-full cursor-pointer" id="progress-bar-{{ section.id }}">
                <div class="absolute h-full bg-blue-500 rounded-full transition-all" 
                     id="progress-filled-{{ section.id }}" 
                     style="width: 0%"></div>
                <!-- Interactive Question Markers -->
                <div id="question-markers-{{ section.id }}">
                    {% for question in interactive_questions %}
                    <div class="absolute w-3 h-3 bg-yellow-400 rounded-full -mt-0.5 cursor-pointer hover:scale-125 transition-transform"
                         style="left: {{ (question.timestamp / section.duration * 100)|round(2) if section.duration > 0 else 0 }}%"
                         title="Question at {{ question.timestamp|int // 60 }}:{{ '%02d'|format(question.timestamp|int % 60) }}"
                         data-timestamp="{{ question.timestamp }}">
                    </div>
                    {% endfor %}
                </div>
            </div>
            <div class="flex justify-between text-xs text-gray-400 mt-1">
                <span id="current-time-{{ section.id }}">0:00</span>
                <span id="duration-{{ section.id }}">0:00</span>
            </div>
        </div>
        
        <!-- Control Buttons -->
        <div class="flex items-center justify-between">
            <!-- Left Controls -->
            <div class="flex items-center space-x-3">
                <!-- Play/Pause Button -->
                <button id="play-pause-btn-{{ section.id }}" 
                        class="text-white hover:text-blue-400 transition-colors focus:outline-none">
                    <svg id="play-icon-{{ section.id }}" class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/>
                    </svg>
                    <svg id="pause-icon-{{ section.id }}" class="w-8 h-8 hidden" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M5 4a2 2 0 012-2h2a2 2 0 012 2v12a2 2 0 01-2 2H7a2 2 0 01-2-2V4zM13 4a2 2 0 012-2h2a2 2 0 012 2v12a2 2 0 01-2 2h-2a2 2 0 01-2-2V4z"/>
                    </svg>
                </button>
                
                <!-- Volume Control -->
                <div class="flex items-center space-x-2">
                    <button id="volume-btn-{{ section.id }}" 
                            class="text-white hover:text-blue-400 transition-colors focus:outline-none">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM12.293 7.293a1 1 0 011.414 0L15 8.586l1.293-1.293a1 1 0 111.414 1.414L16.414 10l1.293 1.293a1 1 0 01-1.414 1.414L15 11.414l-1.293 1.293a1 1 0 01-1.414-1.414L13.586 10l-1.293-1.293a1 1 0 010-1.414z"/>
                        </svg>
                    </button>
                    <input type="range" 
                           id="volume-slider-{{ section.id }}" 
                           class="w-20 h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer" 
                           min="0" 
                           max="100" 
                           value="100">
                </div>
                
                <!-- Time Display -->
                <div class="text-white text-sm font-medium">
                    <span id="time-display-{{ section.id }}">0:00 / 0:00</span>
                </div>
            </div>
            
            <!-- Right Controls -->
            <div class="flex items-center space-x-3">
                <!-- Playback Speed -->
                <div class="relative" id="speed-control-{{ section.id }}">
                    <button class="text-white hover:text-blue-400 transition-colors px-3 py-1 bg-gray-800 rounded-lg text-sm font-medium focus:outline-none"
                            id="speed-btn-{{ section.id }}">
                        1x
                    </button>
                    <div id="speed-menu-{{ section.id }}" 
                         class="absolute bottom-full right-0 mb-2 bg-gray-800 rounded-lg shadow-xl hidden">
                        <button class="block w-full text-left px-4 py-2 text-white hover:bg-gray-700 text-sm speed-option" data-speed="0.25">0.25x</button>
                        <button class="block w-full text-left px-4 py-2 text-white hover:bg-gray-700 text-sm speed-option" data-speed="0.5">0.5x</button>
                        <button class="block w-full text-left px-4 py-2 text-white hover:bg-gray-700 text-sm speed-option" data-speed="0.75">0.75x</button>
                        <button class="block w-full text-left px-4 py-2 text-white hover:bg-gray-700 text-sm speed-option bg-blue-600" data-speed="1">Normal (1x)</button>
                        <button class="block w-full text-left px-4 py-2 text-white hover:bg-gray-700 text-sm speed-option" data-speed="1.25">1.25x</button>
                        <button class="block w-full text-left px-4 py-2 text-white hover:bg-gray-700 text-sm speed-option" data-speed="1.5">1.5x</button>
                        <button class="block w-full text-left px-4 py-2 text-white hover:bg-gray-700 text-sm speed-option" data-speed="1.75">1.75x</button>
                        <button class="block w-full text-left px-4 py-2 text-white hover:bg-gray-700 text-sm rounded-b-lg speed-option" data-speed="2">2x</button>
                    </div>
                </div>
                
                <!-- Subtitles Toggle -->
                {% if section.subtitles %}
                <button id="subtitles-btn-{{ section.id }}" 
                        class="text-white hover:text-blue-400 transition-colors focus:outline-none"
                        title="Toggle Subtitles">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M2 6a2 2 0 012-2h12a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zm2 0v8h12V6H4zm2 3h3v2H6V9zm5 0h3v2h-3V9z"/>
                    </svg>
                </button>
                {% endif %}
                
                <!-- Fullscreen Button -->
                <button id="fullscreen-btn-{{ section.id }}" 
                        class="text-white hover:text-blue-400 transition-colors focus:outline-none">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M3 4a1 1 0 011-1h4a1 1 0 010 2H6.414l2.293 2.293a1 1 0 01-1.414 1.414L5 6.414V8a1 1 0 01-2 0V4zm9 1a1 1 0 010-2h4a1 1 0 011 1v4a1 1 0 01-2 0V6.414l-2.293 2.293a1 1 0 11-1.414-1.414L13.586 5H12zm-9 7a1 1 0 012 0v1.586l2.293-2.293a1 1 0 011.414 1.414L6.414 15H8a1 1 0 010 2H4a1 1 0 01-1-1v-4zm13-1a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 010-2h1.586l-2.293-2.293a1 1 0 011.414-1.414L15 13.586V12a1 1 0 011-1z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Watch Progress Stats -->
<div class="mt-4 bg-gray-50 rounded-lg p-4">
    <div class="grid grid-cols-4 gap-4 text-center">
        <div>
            <p class="text-gray-500 text-xs">Watch Progress</p>
            <p class="text-2xl font-bold text-blue-600" id="watch-percentage-{{ section.id }}">0%</p>
        </div>
        <div>
            <p class="text-gray-500 text-xs">Total Watch Time</p>
            <p class="text-2xl font-bold text-green-600" id="total-watch-time-{{ section.id }}">0m</p>
        </div>
        <div>
            <p class="text-gray-500 text-xs">Play Count</p>
            <p class="text-2xl font-bold text-purple-600" id="play-count-{{ section.id }}">0</p>
        </div>
        <div>
            <p class="text-gray-500 text-xs">Current Speed</p>
            <p class="text-2xl font-bold text-orange-600" id="current-speed-{{ section.id }}">1x</p>
        </div>
    </div>
</div>

<script>
// Video Player Controller for Section {{ section.id }}
(function() {
    const sectionId = {{ section.id }};
    const video = document.getElementById('video-player-' + sectionId);
    const playPauseBtn = document.getElementById('play-pause-btn-' + sectionId);
    const playIcon = document.getElementById('play-icon-' + sectionId);
    const pauseIcon = document.getElementById('pause-icon-' + sectionId);
    const progressBar = document.getElementById('progress-bar-' + sectionId);
    const progressFilled = document.getElementById('progress-filled-' + sectionId);
    const volumeSlider = document.getElementById('volume-slider-' + sectionId);
    const speedBtn = document.getElementById('speed-btn-' + sectionId);
    const speedMenu = document.getElementById('speed-menu-' + sectionId);
    const fullscreenBtn = document.getElementById('fullscreen-btn-' + sectionId);
    const videoContainer = document.getElementById('video-container-' + sectionId);
    const questionOverlay = document.getElementById('interactive-question-overlay-' + sectionId);
    
    let watchStartTime = null;
    let totalWatchTime = 0;
    let playCount = 0;
    let currentSpeed = 1.0;
    let interactiveQuestions = {{ interactive_questions|tojson|safe }};
    let answeredQuestions = new Set();
    
    // ===== PLAY/PAUSE =====
    playPauseBtn.addEventListener('click', togglePlay);
    video.addEventListener('click', togglePlay);
    
    function togglePlay() {
        if (video.paused) {
            video.play();
            playIcon.classList.add('hidden');
            pauseIcon.classList.remove('hidden');
            if (watchStartTime === null) {
                watchStartTime = Date.now();
                playCount++;
                updateStats();
            }
        } else {
            video.pause();
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
            updateWatchTime();
        }
    }
    
    // ===== PROGRESS BAR =====
    video.addEventListener('timeupdate', function() {
        const percent = (video.currentTime / video.duration) * 100;
        progressFilled.style.width = percent + '%';
        
        document.getElementById('current-time-' + sectionId).textContent = formatTime(video.currentTime);
        document.getElementById('duration-' + sectionId).textContent = formatTime(video.duration);
        document.getElementById('time-display-' + sectionId).textContent = 
            formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
        
        // Check for interactive questions
        checkInteractiveQuestions(video.currentTime);
        
        // Auto-save progress every 10 seconds
        if (Math.floor(video.currentTime) % 10 === 0) {
            saveProgress();
        }
    });
    
    progressBar.addEventListener('click', function(e) {
        const rect = progressBar.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        video.currentTime = percent * video.duration;
    });
    
    // ===== VOLUME CONTROL =====
    volumeSlider.addEventListener('input', function() {
        video.volume = this.value / 100;
    });
    
    // ===== PLAYBACK SPEED =====
    speedBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        speedMenu.classList.toggle('hidden');
    });
    
    document.querySelectorAll('.speed-option').forEach(btn => {
        btn.addEventListener('click', function() {
            const speed = parseFloat(this.dataset.speed);
            video.playbackRate = speed;
            currentSpeed = speed;
            speedBtn.textContent = speed + 'x';
            speedMenu.classList.add('hidden');
            document.getElementById('current-speed-' + sectionId).textContent = speed + 'x';
            
            // Remove active class from all options
            document.querySelectorAll('.speed-option').forEach(opt => {
                opt.classList.remove('bg-blue-600');
            });
            this.classList.add('bg-blue-600');
        });
    });
    
    // Close speed menu when clicking outside
    document.addEventListener('click', function(e) {
        if (!speedBtn.contains(e.target) && !speedMenu.contains(e.target)) {
            speedMenu.classList.add('hidden');
        }
    });
    
    // ===== FULLSCREEN =====
    fullscreenBtn.addEventListener('click', function() {
        if (!document.fullscreenElement) {
            videoContainer.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    });
    
    // ===== SUBTITLES =====
    {% if section.subtitles %}
    const subtitlesBtn = document.getElementById('subtitles-btn-' + sectionId);
    subtitlesBtn.addEventListener('click', function() {
        const tracks = video.textTracks;
        for (let i = 0; i < tracks.length; i++) {
            tracks[i].mode = tracks[i].mode === 'showing' ? 'hidden' : 'showing';
        }
    });
    {% endif %}
    
    // ===== INTERACTIVE QUESTIONS =====
    function checkInteractiveQuestions(currentTime) {
        interactiveQuestions.forEach(question => {
            const questionKey = 'q-' + question.id;
            if (!answeredQuestions.has(questionKey) && 
                Math.abs(currentTime - question.timestamp) < 0.5) {
                if (question.pause_video) {
                    video.pause();
                    playIcon.classList.remove('hidden');
                    pauseIcon.classList.add('hidden');
                }
                showInteractiveQuestion(question);
                answeredQuestions.add(questionKey);
            }
        });
    }
    
    function showInteractiveQuestion(question) {
        const questionCard = document.getElementById('question-card-' + sectionId);
        
        let optionsHTML = `
            <div class="space-y-2">
                <button class="w-full text-left px-4 py-3 bg-gray-100 hover:bg-blue-100 rounded-lg transition-colors question-option" data-answer="A">
                    <span class="font-bold text-blue-600">A.</span> ${question.option_a}
                </button>
                <button class="w-full text-left px-4 py-3 bg-gray-100 hover:bg-blue-100 rounded-lg transition-colors question-option" data-answer="B">
                    <span class="font-bold text-blue-600">B.</span> ${question.option_b}
                </button>
        `;
        
        if (question.option_c) {
            optionsHTML += `
                <button class="w-full text-left px-4 py-3 bg-gray-100 hover:bg-blue-100 rounded-lg transition-colors question-option" data-answer="C">
                    <span class="font-bold text-blue-600">C.</span> ${question.option_c}
                </button>
            `;
        }
        
        if (question.option_d) {
            optionsHTML += `
                <button class="w-full text-left px-4 py-3 bg-gray-100 hover:bg-blue-100 rounded-lg transition-colors question-option" data-answer="D">
                    <span class="font-bold text-blue-600">D.</span> ${question.option_d}
                </button>
            `;
        }
        
        questionCard.innerHTML = `
            <div class="text-center mb-6">
                <span class="inline-block px-4 py-2 bg-yellow-100 text-yellow-800 rounded-full text-sm font-semibold mb-3">
                    ⏸️ Interactive Question
                </span>
                <h3 class="text-xl font-bold text-gray-800">${question.question_text}</h3>
            </div>
            ${optionsHTML}
            </div>
            <div id="question-feedback-${question.id}" class="mt-4 hidden"></div>
        `;
        
        questionOverlay.classList.remove('hidden');
        
        // Handle answer selection
        document.querySelectorAll('.question-option').forEach(btn => {
            btn.addEventListener('click', function() {
                const selectedAnswer = this.dataset.answer;
                const isCorrect = selectedAnswer === question.correct_answer;
                submitQuestionResponse(question.id, selectedAnswer, isCorrect);
                
                // Show feedback
                const feedbackDiv = document.getElementById('question-feedback-' + question.id);
                feedbackDiv.classList.remove('hidden');
                
                if (isCorrect) {
                    feedbackDiv.innerHTML = `
                        <div class="bg-green-100 border border-green-400 rounded-lg p-4">
                            <p class="text-green-800 font-semibold mb-2">✅ Correct!</p>
                            ${question.explanation ? '<p class="text-green-700 text-sm">' + question.explanation + '</p>' : ''}
                        </div>
                    `;
                } else {
                    feedbackDiv.innerHTML = `
                        <div class="bg-red-100 border border-red-400 rounded-lg p-4">
                            <p class="text-red-800 font-semibold mb-2">❌ Incorrect</p>
                            <p class="text-red-700 text-sm">The correct answer was <strong>${question.correct_answer}</strong></p>
                            ${question.explanation ? '<p class="text-red-700 text-sm mt-2">' + question.explanation + '</p>' : ''}
                        </div>
                    `;
                }
                
                // Add continue button
                setTimeout(() => {
                    feedbackDiv.innerHTML += `
                        <button class="mt-4 w-full bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors font-semibold" onclick="document.getElementById('interactive-question-overlay-${sectionId}').classList.add('hidden'); document.getElementById('video-player-${sectionId}').play();">
                            Continue Watching →
                        </button>
                    `;
                }, 1000);
            });
        });
    }
    
    function submitQuestionResponse(questionId, selectedAnswer, isCorrect) {
        fetch('/student/video-question/respond', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token() }}'
            },
            body: JSON.stringify({
                question_id: questionId,
                selected_answer: selectedAnswer,
                is_correct: isCorrect
            })
        });
    }
    
    // ===== WATCH TRACKING =====
    function updateWatchTime() {
        if (watchStartTime) {
            const sessionTime = Math.floor((Date.now() - watchStartTime) / 1000);
            totalWatchTime += sessionTime;
            watchStartTime = null;
            
            const minutes = Math.floor(totalWatchTime / 60);
            document.getElementById('total-watch-time-' + sectionId).textContent = minutes + 'm';
        }
    }
    
    function updateStats() {
        document.getElementById('play-count-' + sectionId).textContent = playCount;
    }
    
    function saveProgress() {
        const watchPercentage = (video.currentTime / video.duration) * 100;
        document.getElementById('watch-percentage-' + sectionId).textContent = Math.round(watchPercentage) + '%';
        
        fetch('/student/video-progress/' + sectionId, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token() }}'
            },
            body: JSON.stringify({
                current_time: video.currentTime,
                duration: video.duration,
                watch_percentage: watchPercentage,
                total_watch_time: totalWatchTime,
                playback_speed: currentSpeed,
                play_count: playCount
            })
        });
    }
    
    // Save progress when leaving
    window.addEventListener('beforeunload', function() {
        updateWatchTime();
        saveProgress();
    });
    
    video.addEventListener('pause', updateWatchTime);
    video.addEventListener('ended', function() {
        updateWatchTime();
        saveProgress();
    });
    
    // Load saved progress
    fetch('/student/video-progress/' + sectionId)
        .then(response => response.json())
        .then(data => {
            if (data.current_time > 0) {
                video.currentTime = data.current_time;
                totalWatchTime = data.total_watch_time || 0;
                playCount = data.play_count || 0;
                
                const minutes = Math.floor(totalWatchTime / 60);
                document.getElementById('total-watch-time-' + sectionId).textContent = minutes + 'm';
                document.getElementById('play-count-' + sectionId).textContent = playCount;
                document.getElementById('watch-percentage-' + sectionId).textContent = Math.round(data.watch_percentage || 0) + '%';
            }
        });
    
    // Helper functions
    function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return mins + ':' + (secs < 10 ? '0' : '') + secs;
    }
    
    // Keyboard shortcuts
    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        
        switch(e.key) {
            case ' ':
                e.preventDefault();
                togglePlay();
                break;
            case 'ArrowRight':
                video.currentTime += 5;
                break;
            case 'ArrowLeft':
                video.currentTime -= 5;
                break;
            case 'ArrowUp':
                video.volume = Math.min(1, video.volume + 0.1);
                volumeSlider.value = video.volume * 100;
                break;
            case 'ArrowDown':
                video.volume = Math.max(0, video.volume - 0.1);
                volumeSlider.value = video.volume * 100;
                break;
            case 'f':
                fullscreenBtn.click();
                break;
        }
    });
})();
</script>
