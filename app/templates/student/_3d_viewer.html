<!-- 3D Model Viewer with Three.js -->
<div id="viewer-container-{{ section.id }}"
     class="w-full rounded-2xl overflow-hidden border border-gray-200 shadow-sm bg-gray-900 mb-5 relative 3d-viewer three-d-viewer"
     style="aspect-ratio: 16/9; min-height: 400px;"
     data-section-id="{{ section.id }}"
     data-media-file="{% if section.media_file %}{{ url_for('static', filename='uploads/' + section.media_file) }}{% endif %}"
     data-hotspots="{% if section.hotspots %}{{ section.hotspots | tojson | safe }}{% endif %}"
     data-labels="{% if section.labels %}{{ section.labels | tojson | safe }}{% endif %}"
     data-animations="{% if section.animations %}{{ section.animations | tojson | safe }}{% endif %}">
    <div id="loading-{{ section.id }}" class="absolute inset-0 flex items-center justify-center bg-gray-900 text-white z-10">
        <div class="text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-white mx-auto mb-4"></div>
            <p class="text-sm">Loading 3D model...</p>
        </div>
    </div>
    <canvas id="canvas-{{ section.id }}"></canvas>

    <!-- Hotspot Popup -->
    <div id="hotspot-popup-{{ section.id }}" class="absolute hidden bg-white rounded-xl shadow-2xl p-4 max-w-sm z-20 border border-gray-200">
        <div class="flex justify-between items-start mb-2">
            <h4 id="hotspot-title-{{ section.id }}" class="font-bold text-gray-800"></h4>
            <button id="close-popup-{{ section.id }}" class="text-gray-400 hover:text-gray-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <div id="hotspot-content-{{ section.id }}" class="text-sm text-gray-600"></div>
    </div>

    <!-- Label Dragging Interface -->
    <div id="label-panel-{{ section.id }}" class="absolute top-4 right-4 bg-white/95 backdrop-blur-sm rounded-lg shadow-lg p-3 max-w-xs z-20 hidden">
        <h4 class="font-bold text-gray-800 text-sm mb-2">🏷️ Drag labels to model parts</h4>
        <div id="draggable-labels-{{ section.id }}" class="space-y-2"></div>
        <div id="label-progress-{{ section.id }}" class="mt-3 pt-3 border-t border-gray-200 text-xs text-gray-600"></div>
    </div>

    <!-- Controls -->
    <div class="absolute bottom-4 left-4 right-4 flex items-center justify-between bg-black/50 backdrop-blur-sm rounded-lg p-3 z-10">
        <div class="flex items-center gap-2 text-white text-xs">
            <span class="bg-white/20 px-2 py-1 rounded">🖱️ Drag to rotate</span>
            <span class="bg-white/20 px-2 py-1 rounded">🔍 Scroll to zoom</span>
            <span class="bg-white/20 px-2 py-1 rounded">⌨️ Right-click to pan</span>
        </div>
        <div class="flex items-center gap-2">
            <button id="toggle-hotspots-{{ section.id }}" class="bg-white/20 hover:bg-white/30 text-white px-3 py-1 rounded text-xs transition">
                📍 Hotspots
            </button>
            <button id="toggle-labels-{{ section.id }}" class="bg-white/20 hover:bg-white/30 text-white px-3 py-1 rounded text-xs transition">
                🏷️ Labels
            </button>
            <button id="reset-view-{{ section.id }}" class="bg-white/20 hover:bg-white/30 text-white px-3 py-1 rounded text-xs transition">
                Reset View
            </button>
        </div>
    </div>
</div>

<script>
(function() {
    function loadScript(src, cb) {
        var existing = document.querySelector('script[src="' + src + '"]');
        if (existing) {
            if (existing.dataset && existing.dataset.loaded === 'true') {
                cb && cb();
            } else {
                existing.addEventListener('load', function() { cb && cb(); });
            }
            return;
        }
        var s = document.createElement('script');
        s.src = src;
        s.async = false;
        s.onload = function() {
            s.dataset.loaded = 'true';
            cb && cb();
        };
        document.head.appendChild(s);
    }

    function initSectionViewer() {
        var container = document.getElementById('viewer-container-{{ section.id }}');
        if (!container) return;
        if (window.init3DViewerGlobal) {
            window.init3DViewerGlobal(container);
        } else if (typeof initAll3DViewers === 'function') {
            initAll3DViewers();
        }
    }

    if (typeof THREE === 'undefined' || typeof THREE.OrbitControls === 'undefined' || typeof THREE.GLTFLoader === 'undefined') {
        loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', function() {
            loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js', function() {
                loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js', function() {
                    loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js', function() {
                        loadScript("{{ url_for('static', filename='js/3d-viewer.js') }}", function() {
                            initSectionViewer();
                        });
                    });
                });
            });
        });
    } else {
        initSectionViewer();
    }
})();
</script>
